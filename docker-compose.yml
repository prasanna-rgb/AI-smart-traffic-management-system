version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_traffic_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_traffic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: smart_traffic_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/smart_traffic
      - API_HOST=0.0.0.0
      - API_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smart_traffic_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
